<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon" href="/repositories.ico" />
<meta charset="utf-8">
<title>Package Finder - Repositories</title>

<style>
/* ΟΡΙΣΜΟΣ ΜΕΤΑΒΛΗΤΩΝ ΓΙΑ LIGHT ΚΑΙ DARK MODE */
:root {
    --bg-color: #fdfdfd;
    --text-color: #333333;
    --heading-color: #222222;
    --card-bg: #f4f4f4;
    --card-border: #ccc;
    --table-th-bg: #f4f4f4;
    --table-hover: #f9f9f9;
    --card-text: #111111;
    --card-title: #666666;
    --desc-text: #555555;
    --dep-unsupported-bg: #e2e3e5;
    --dep-unsupported-text: #383d41;
    --dep-unsupported-border: #d6d8db;
}

body.dark-mode {
    --bg-color: #1a202c;
    --text-color: #e2e8f0;
    --heading-color: #ffffff;
    --card-bg: #2d3748;
    --card-border: #4a5568;
    --table-th-bg: #4a5568;
    --table-hover: #2d3748;
    --card-text: #ffffff;
    --card-title: #cbd5e0;
    --desc-text: #cbd5e0;
    --dep-unsupported-bg: #4a5568;
    --dep-unsupported-text: #edf2f7;
    --dep-unsupported-border: #718096;
}

body {
    font-family: sans-serif;
    margin:30px;
    background: var(--bg-color);
    color: var(--text-color);
    transition: background 0.3s, color 0.3s;
}

h1 {
    color: var(--heading-color);
}

.nav-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.theme-toggle-btn {
    background: #4a5568;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.2s;
}
body.dark-mode .theme-toggle-btn {
    background: #edf2f7;
    color: #1a202c;
}

.stats-container {
    display: flex;
    gap: 20px;
    margin: 20px 0;
}

.stats-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 15px 25px;
    border-radius: 6px;
    min-width: 150px;
}

.stats-card h3 {
    margin: 0 0 5px 0;
    font-size: 14px;
    color: var(--card-title);
    text-transform: uppercase;
}

.stats-card p {
    margin: 0;
    font-size: 24px;
    font-weight: bold;
    color: var(--card-text);
}
table {
    border-collapse:collapse;
    width:100%;
    margin-top: 20px;
    background: var(--card-bg);
}

td, th {
    border:1px solid var(--card-border);
    padding:10px;
    text-align: left;
}

th {
    background: var(--table-th-bg);
    color: var(--text-color);
}

tr:hover {
    background: var(--table-hover);
}

.description-text {
    font-size: 13px;
    color: var(--desc-text);
    margin-top: 4px;
    display: block;
}

.badge-rank {
    background: #2d7;
    color: black;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
}

.dep-status {
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
}

.dep-supported {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.dep-unsupported {
    background: var(--dep-unsupported-bg);
    color: var(--dep-unsupported-text);
    border: 1px solid var(--dep-unsupported-border);
}

.filter-link {
    color: #4299e1;
    text-decoration: none;
    font-weight: bold;
}

.filter-link:hover {
    text-decoration: underline;
}

a {
    color: #4299e1;
}

/* ΠΡΟΣΘΗΚΗ: Το στυλ του Footer */
.footer {
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid var(--card-border);
    text-align: center;
    font-size: 13px;
    color: var(--text-color);
    opacity: 0.7;
    font-weight: 500;
}
.footer a {
    color: #4299e1;
    text-decoration: none;
}
.footer a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="nav-header">
    <div>
        <a href="javascript:history.back()" style="text-decoration: none;">
            <span style="text-decoration: none; display: inline-block;">←</span> 
            <span style="text-decoration: underline;">Back</span>
        </a>
        |
        <a href="index.html">Package Finder Home</a>
    </div>
    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
</div>

<h1>Repositories</h1>

<div class="stats-container">
    <div class="stats-card">
        <h3>Total Repositories</h3>
        <p id="stat-repos">0</p>
    </div>
    <div class="stats-card">
        <h3>Total Packages</h3>
        <p id="stat-packages">0</p>
    </div>
    <div class="stats-card">
        <h3>Total Files Indexed</h3>
        <p id="stat-files">0</p>
    </div>
</div>

<div id="repos"></div>

<!-- ΠΡΟΣΘΗΚΗ: Το HTML του Footer -->
<div class="footer">
    &copy; 2026 Developed by <strong>Dimitris Tzemos</strong>. All rights reserved | <a href="index.html">Package Finder</a>
</div>
<script>
function initTheme() {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('theme-toggle').innerText = "☀️ Light Mode";
    }
}

function toggleTheme() {
    let btn = document.getElementById('theme-toggle');
    if (document.body.classList.contains('dark-mode')) {
        document.body.classList.remove('dark-mode');
        btn.innerText = "🌙 Dark Mode";
        localStorage.setItem('theme', 'light');
    } else {
        document.body.classList.add('dark-mode');
        btn.innerText = "☀️ Light Mode";
        localStorage.setItem('theme', 'dark');
    }
}

initTheme();

fetch("/api/repositories.py")
.then(r => r.json())
.then(data => {
    let totalRepos = data.length;
    let totalPackages = 0;
    let totalFiles = 0;

    data.forEach(r => {
        totalPackages += Number(r.nr_packages || 0);
        totalFiles += Number(r.nr_files || 0);
    });

        document.getElementById("stat-repos").innerText = totalRepos.toLocaleString();
    document.getElementById("stat-packages").innerText = totalPackages.toLocaleString();
    document.getElementById("stat-files").innerText = totalFiles.toLocaleString();

    data.sort((a, b) => Number(b.rank) - Number(a.rank));

    let html = `
    <table>
    <tr>
        <th>Rank</th>
        <th>Repository / Description</th>
        <th>Slack Version</th>
        <th>Arch</th>
        <th>Packages</th>
        <th>Dependencies</th>
        <th>File list</th>
        <th>Last Update</th>
    </tr>
    `;

    data.forEach(r => {
        let filesDisplay = r.nr_files > 0 ? r.nr_files.toLocaleString() : "<em>Unsupported</em>";
        let packagesDisplay = r.nr_packages ? r.nr_packages.toLocaleString() : "0";
        let updateDisplay = r.last_update ? r.last_update : "<em>Unknown</em>";
        
        let depClass = r.dependencies === "supported" ? "dep-supported" : "dep-unsupported";
        let depText = r.dependencies || "unsupported";
        let depsDisplay = `<span class="dep-status ${depClass}">${depText}</span>`;

        let cleanArch = r.arch.toLowerCase();
        if (cleanArch.includes("i486") || cleanArch.includes("i686") || cleanArch.includes("i386")) {
            cleanArch = "i386";
        }

        let targetDistro = "";
        let repoNameLower = r.name.toLowerCase();
        let slackVerLower = r.slackware_version.toLowerCase();

        if (repoNameLower.includes("slackel")) {
            targetDistro = "slackel";
        } else if (repoNameLower.includes("salix")) {
            targetDistro = "salix " + slackVerLower;
        } else {
            targetDistro = "slackware " + slackVerLower;
        }

        html += `
        <tr>
            <td><span class="badge-rank">${r.rank}</span></td>
            <td>
                <strong><a href="${r.url}" target="_blank">${r.name}</a></strong>
                <span class="description-text">${r.description || 'No description available.'}</span>
            </td>
            <!-- ΔΙΟΡΘΩΣΗ: Προσθήκη &arch= ώστε να μην γυρίζει το radio button στο ALL -->
            <td>
                <a class="filter-link" href="index.html?search=${encodeURIComponent(targetDistro)}&arch=${encodeURIComponent(cleanArch)}">
                    ${r.slackware_version}
                </a>
            </td>
            <td>
                <a class="filter-link" href="index.html?search=${encodeURIComponent(cleanArch)}&distro=${encodeURIComponent(targetDistro)}">
                    <code>${r.arch}</code>
                </a>
            </td>
            <td>${packagesDisplay}</td>
            <td>${depsDisplay}</td>
            <td>${filesDisplay}</td>
            <td><small>${updateDisplay}</small></td>
        </tr>
        `;
    });

    html += "</table>";
    document.getElementById("repos").innerHTML = html;
})
.catch(err => {
    console.error("Error loading repositories:", err);
    document.getElementById("repos").innerHTML = "<p style='color:red; font-weight:bold;'>Error loading repositories data.</p>";
});
</script>
</body>
</html>
